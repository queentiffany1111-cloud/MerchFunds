# deploy/k8s/namespace.yaml
# Dedicated Kubernetes namespace for all MerchFunds backend workloads.
# Apply first: kubectl apply -f deploy/k8s/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: merchfunds
  labels:
    app.kubernetes.io/name: merchfunds
    app.kubernetes.io/managed-by: kubectl
